<!-- 3.Seite -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wahlpflichtmodule</title>

  <!-- Gemeinsames CSS für alle Seiten -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Eigenes CSS nur für Beschreibung-Seite -->
  <link rel="stylesheet" href="css/wpm.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <img src="../assets/logo/Hochschule_Düsseldorf_logo.png" alt="HSD Logo" class="logo">

      <h2>
        Wahlpflichtmodule<br>
        Anbieter Hub
      </h2>
    </div>

    <div class="icons">
      <img src="../assets/lehrende/Search.svg" alt="Suche" class="icon">
      <img src="../assets/lehrende/User.svg" alt="Profil" class="icon">
      <img src="../assets/lehrende/Settings.svg" alt="Einstellungen" class="icon">
    </div>
  </header>

  <main class="wrapper">

    <!-- TITEL -->
    <section class="title-box">
      <h1>Wahlpflichtmodule wählen</h1>
    </section>

    <!-- SCHRITTE -->
    <nav class="steps">
      <button class="step" onclick="goToPage('zuordnung.html')">Zuordnung</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil">
      <button class="step" onclick="goToPage('wpm.html')">Beschreibung</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil">
      <button class="step active">Wahlpflichtmodule</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil">
      <button class="step" onclick="goToPage('orga.html')">Organisation</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil">
      <button class="step" onclick="goToPage('vorschau.html')">Vorschau</button>
    </nav>

<!-- Weißer Inhaltsbereich -->
<section class="content-card">

  <!-- Buttons oben rechts -->
  <div class="top-actions">
    <button class="secondary" onclick="goToPage('vorschau.html')">Vorschau</button>
    <button class="save">Änderungen speichern</button>
  </div>

  <!-- MMI -->
  <div class="wpm-section">
    <div class="section-title">MMI</div>

    <div class="mmi-content">
      <label>
        <input type="checkbox">
        Wahlpflichtmodul 1-8 mit Angebot ohne Beschreibung im MHB für „Spezielle Aspekte“
      </label>

      <label>
        <input type="checkbox">
        Masterprojekt 1-3, Individuelles Projekt
      </label>
    </div>
  </div>

  <!-- BMI -->
  <div class="wpm-section">
    <div class="section-title">BMI</div>

    <!-- BMI 2018 -->
    <div class="year-header" onclick="toggleYear('bmi2018')">
      <div class="year-left">
        <span>2018</span>
        <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow" id="arrow-bmi2018">
      </div>
    </div>

    <div class="year-content" id="bmi2018">
      <label><input type="checkbox"> Informatikprojekt 1</label>
      <label><input type="checkbox"> Informatikprojekt 2</label>
      <label><input type="checkbox"> Medienprojekt A / B</label>
      <label><input type="checkbox"> Vertiefung B / D</label>
      <label><input type="checkbox"> Individuelle Vertiefung</label>
    </div>

    <!-- BMI 2025 -->
    <div class="year-header" onclick="toggleYear('bmi2025')">
      <div class="year-left">
        <span>2025</span>
        <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow" id="arrow-bmi2025">
      </div>
    </div>

    <div class="year-content" id="bmi2025">
      <label><input type="checkbox"> Informatikprojekt 1</label>
      <label><input type="checkbox"> Informatikprojekt 2</label>
      <label><input type="checkbox"> Medienprojekt A / B</label>
      <label><input type="checkbox"> WPM Informatik A / B</label>
      <label><input type="checkbox"> WPM Medien A / B</label>
      <label><input type="checkbox"> WPM Individuell</label>
    </div>
  </div>

  <!-- BMT -->
  <div class="wpm-section">
    <div class="section-title">BMT</div>

    <!-- BMT 2018 -->
    <div class="year-header" onclick="toggleYear('bmt2018')">
      <div class="year-left">
        <span>2018</span>
        <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow" id="arrow-bmt2018">
      </div>
    </div>

    <div class="year-content" id="bmt2018">
      <label><input type="checkbox"> Wahlmodul</label>
      <label><input type="checkbox"> Individuelle Vertiefung</label>

      <!-- Gruppe: Projektmodul mit CP -->
      <div class="checkbox-group">
        <label><input type="checkbox"> Projektmodul mit</label>

        <div class="group-options">
          <label><input type="checkbox"> 5 CP</label>
          <label><input type="checkbox"> 10 CP</label>
        </div>
      </div>
    </div>

    <!-- BMT 2025 -->
    <div class="year-header" onclick="toggleYear('bmt2025')">
      <div class="year-left">
        <span>2025</span>
        <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow" id="arrow-bmt2025">
      </div>
    </div>

    <div class="year-content" id="bmt2025">
      <label><input type="checkbox"> Fokusmodul A / B</label>
      <label><input type="checkbox"> Wahlpflichtmodul 1-5</label>
      <label><input type="checkbox"> Individuelles Wahlpflichtmodul</label>
    </div>
  </div>

  <!-- BTB -->
  <div class="wpm-section">
    <div class="section-title">BTB</div>

    <div class="mmi-content">
      <!-- Gruppe: Vertiefungsmodul mit CP -->
      <div class="checkbox-group">
        <label><input type="checkbox"> Vertiefungsmodul mit</label>

        <div class="group-options">
          <label><input type="checkbox"> 5 CP</label>
          <label><input type="checkbox"> 10 CP</label>
        </div>
      </div>
    </div>
  </div>

  <!-- DAISY -->
  <div class="wpm-section">
    <div class="section-title">DAISY</div>

    <div class="mmi-content">
      <label><input type="checkbox"> Individuelle Vertiefung</label>
    </div>
  </div>

  <!-- Buttons unten -->
  <div class="bottom-actions">
    <button class="secondary" onclick="goToPage('beschreibung.html')">Zurück</button>
    <button class="save">Änderungen speichern</button>
    <button class="next-button" onclick="goToPage('orga.html')">Weiter</button>
  </div>

</section>

</main>

  <!-- JavaScript für Navigation -->
  <script src="js/navigation.js"></script>
</body>
</html>
