<!-- 1.seite -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angebot erstellen</title>

  <!-- Gemeinsames Design -->
  <link rel="stylesheet" href="css/style.css">

  <!-- CSS nur für diese Seite -->
  <link rel="stylesheet" href="css/zuordnung.css">
</head>

<body>

  <!-- HEADER: Logo, Titel und Icons -->
  <header class="header">
    <div class="brand">
      <img src="../assets/logo/Hochschule_Düsseldorf_logo.png" alt="HSD Logo" class="logo">

      <h2>
        Wahlpflichtmodule<br>
        Anbieter Hub
      </h2>
    </div>

    <div class="icons">
      <img src="../assets/lehrende/Search.svg" alt="Suche" class="icon">
      <img src="../assets/lehrende/User.svg" alt="Profil" class="icon">
      <img src="../assets/lehrende/Settings.svg" alt="Einstellungen" class="icon">
    </div>
  </header>

  <main class="wrapper">

    <!-- Seitentitel -->
    <section class="title-box">
      <h1>Angebot erstellen</h1>
    </section>

    <!-- Schritte / Navigation -->
    <nav class="steps">
      <button class="step active">Zuordnung</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow">
      <button class="step"  onclick="goToPage('beschreibung.html')">Beschreibung</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow">
      <button class="step" onclick="goToPage('wpm.html')">Wahlpflichtmodule</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow">
      <button class="step" onclick="goToPage('orga.html')">Organisation</button>
      <img src="../assets/lehrende/arrow.svg" alt="Pfeil" class="arrow">
      <button class="step" onclick="goToPage('vorschau.html')">Vorschau</button>
  </nav>

    <!-- Inhalt -->
    <section class="content-card zuordnung-card">

      <!-- Buttons oben rechts -->
       <div class="top-actions">
        <button class="secondary" onclick="goToPage('vorschau.html')">Vorschau</button>
        <button class="save" onclick="showSavedMessage()">Änderungen speichern</button>
      </div>

    <div class="save-container">
      <span id="saveMessage" class="save-message">
          ✓ Änderungen gespeichert
      </span>
    </div>

      <!-- Grauer Abschnittstitel -->
      <div class="section-title">Angebotstyp</div>

      <!-- Option 1 -->
      <label class="radio-option">
        <input type="radio" name="angebotstyp" value="projekt">
        <div>
          <strong>Projekt</strong>
          <p>Wenn ein Projekt angeboten wird, muss es nicht zu einem Modul gehören.</p>
        </div>
      </label>

      <!-- Option 2 -->
      <label class="radio-option">
        <input type="radio" name="angebotstyp" value="klv">
        <div>
          <strong>klassische Lehrveranstaltung</strong>
          <p>
            Wenn eine klassische Lehrveranstaltung mit expliziter Wissensvermittlung über Vorlesung,
            Seminar, usw. angeboten wird, ist die Zuordnung zu einem Modul erforderlich.
          </p>
        </div>
      </label>

    </section>

    <!-- Button unten rechts außerhalb der weißen Fläche -->
    <div class="page-bottom">
      <button class="next-button"
        onclick="nextFromZuordnung()">
          Weiter
      </button>
      <!-- <button class="next-button" onclick="goToPage('beschreibung.html')">Weiter</button> -->
    </div>

  </main>

  <script src="js/navigation.js"></script>
</body>
</html>
