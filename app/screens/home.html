<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Bewerbungsportal</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Top Navigation -->
    <header class="topbar">
        <img src="../assets/icons/Hochschule_Düsseldorf_logo.png" class="logo">

        <div class="top-icons">
            <img src="../assets/icons/Search.svg" class="icon">
            <img src="../assets/icons/User.svg" class="icon">
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-step active"></div>
        <div class="progress-step"></div>
        <div class="progress-step"></div>
    </div>

    <!-- Title -->
    <section class="page-title">
        <h1>Bewerbungen für Wahlangebote</h1>
        <p>Kurs Bewerbungsportal</p>
    </section>

    <!-- Course Blocks -->
    <section class="course-list">

        <div class="course-card">
            <h2>Informatikprojekt 1/2</h2>
            <p>Verschiedene Projekte für 2. und 3. Semester</p>
            <button class="start-btn" onclick="goTo('modulwahl.html?modul=ip')">Zu den Kursen</button>
        </div>

        <div class="course-card">
            <h2>Medienprojekt A/B</h2>
            <p>Verschiedene Projekte für 4. und 5. Semester</p>
            <button class="start-btn" onclick="goTo('modulwahl.html?modul=ip')">Zu den Kursen</button>
        </div>

        <div class="course-card">
            <h2>Vertiefung A/C</h2>
            <p>Vertiefungen SoSe</p>
            <button class="start-btn" onclick="goTo('modulwahl.html?modul=ip')">Zu den Kursen</button>
        </div>

        <div class="course-card">
            <h2>Vertiefung B/C</h2>
            <p>Vertiefungen WiSe</p>
            <button class="start-btn" onclick="goTo('modulwahl.html?modul=ip')">Zu den Kursen</button>
        </div>

    </section>

    <script src="../js/navigation.js"></script>
</body>
</html>
