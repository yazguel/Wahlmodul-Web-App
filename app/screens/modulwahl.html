<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulauswahl</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Top Navigation -->
    <header class="topbar">
        <img src="../assets/icons/Hochschule_Düsseldorf_logo.png" class="logo">

        <div class="top-icons">

            <img src="../assets/icons/User.svg" class="icon">
        </div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-container">
        <div class="progress-step"></div>

    <section class="page-title">

        <p>Modulauswahl</p>

    <div class="tag-chips">

        <span data-tag="Klausur">Klausur</span>

    <section class="course-list"></section>

    <!-- Zurück Button -->
    <button class="back-btn" onclick="goTo('home.html')">← Zurück</button>

    <script src="../js/navigation.js"></script>
    <script src="../js/dropdown.js"></script>

</html>
